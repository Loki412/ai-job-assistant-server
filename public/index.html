<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 求职助手</title>
<meta name="description" content="AI 简历分析 · ATS 评分 · 岗位匹配 · 简历润色 · 提升路线">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="dashboard">

<div class="app">

  <!-- ================= 侧栏 ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.6l2.5 6.4 6.4 2.5-6.4 2.5L12 20.4l-2.5-6.4L3.1 11.5l6.4-2.5L12 2.6z" fill="currentColor"/></svg>
      </div>
      <div class="brand-text">
        <strong>AI 求职助手</strong>
        <span id="brandStatus" class="brand-status"><i class="dot"></i><em>连接中</em></span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-group">
        <div class="nav-label">概览</div>
        <button class="nav-item" data-view="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
          <span>工作台</span>
        </button>
      </div>

      <div class="nav-group">
        <div class="nav-label">分析</div>
        <button class="nav-item" data-view="analyze">
          <svg viewBox="0 0 24 24"><path d="M12 3.4l1.9 4.7 4.7 1.9-4.7 1.9L12 16.6l-1.9-4.7L5.4 10l4.7-1.9L12 3.4z"/><path d="M18.6 15.4l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1z"/></svg>
          <span>简历分析</span>
        </button>
        <button class="nav-item" data-view="ats">
          <svg viewBox="0 0 24 24"><path d="M4.5 18.5a8.5 8.5 0 1 1 15 0"/><path d="M12 14.6l3.2-3.2"/><circle cx="12" cy="15.4" r="1.4"/></svg>
          <span>ATS 评分</span>
        </button>
        <button class="nav-item" data-view="match">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1"/></svg>
          <span>岗位匹配</span>
        </button>
      </div>

      <div class="nav-group">
        <div class="nav-label">优化</div>
        <button class="nav-item" data-view="optimize">
          <svg viewBox="0 0 24 24"><path d="M5 19l1.2-4 8.6-8.6a2.1 2.1 0 0 1 3 3L9.2 18 5 19z"/><path d="M14.4 6.8l2.8 2.8"/></svg>
          <span>简历润色</span>
        </button>
        <button class="nav-item" data-view="roadmap">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="6.5" r="2.4"/><circle cx="18" cy="17.5" r="2.4"/><path d="M8.4 6.5h4.4a3.2 3.2 0 0 1 0 6.4h-1.6a3.2 3.2 0 0 0 0 6.4h4.4"/></svg>
          <span>提升路线</span>
        </button>
      </div>

      <div class="nav-group">
        <div class="nav-label">发现</div>
        <button class="nav-item" data-view="jobs">
          <svg viewBox="0 0 24 24"><rect x="3.2" y="7.4" width="17.6" height="12.4" rx="2.4"/><path d="M8.6 7.4V6a2 2 0 0 1 2-2h2.8a2 2 0 0 1 2 2v1.4"/><path d="M3.2 12.6h17.6"/></svg>
          <span>岗位推荐</span>
        </button>
        <button class="nav-item" data-view="salary">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.4v9.2M14.6 9.8c0-1.2-1.1-2-2.6-2s-2.6.8-2.6 2c0 2.6 5.4 1.4 5.4 4 0 1.2-1.2 2-2.8 2s-2.8-.8-2.8-2"/></svg>
          <span>薪资查询</span>
        </button>
      </div>

      <div class="nav-group">
        <div class="nav-label">记录</div>
        <button class="nav-item" data-view="history">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.6V12l3.2 2"/></svg>
          <span>历史记录</span>
        </button>
      </div>
    </nav>

    <div class="sidebar-foot">
      <button class="account" id="accountBtn">
        <span class="avatar" id="avatar">—</span>
        <span class="account-text">
          <strong id="accountName">未登录</strong>
          <em id="accountMeta">点击登录</em>
        </span>
      </button>
      <button class="icon-btn" id="settingsBtn" title="设置 API 地址">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a1.9 1.9 0 1 1-3.8 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0-1.1-2.7H4.2a1.9 1.9 0 0 1 0-3.8h.2a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 2.7-1.1V4a1.9 1.9 0 1 1 3.8 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a1.9 1.9 0 0 1 0 3.8h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg>
      </button>
    </div>
  </aside>

  <!-- ================= 主区 ================= -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="pageTitle">工作台</h1>
        <p id="pageSub">先把简历和目标岗位填好，后面的分析都用它。</p>
      </div>
      <div class="topbar-actions">
        <span class="ready-chip" id="readyChip"><i class="dot"></i>简历未填写</span>
        <button class="btn btn-primary" id="runAllBtn">
          <svg viewBox="0 0 24 24"><path d="M12 3.4l1.9 4.7 4.7 1.9-4.7 1.9L12 16.6l-1.9-4.7L5.4 10l4.7-1.9L12 3.4z"/></svg>
          一键分析
        </button>
      </div>
    </header>

    <div class="scroller">

      <!-- 简历 / JD 输入 -->
      <section class="card context-card" id="contextCard">
        <div class="card-head">
          <div class="card-head-left">
            <h2>简历与目标岗位</h2>
            <p>内容会保存在本机浏览器里，只在点击分析时发给服务端。</p>
          </div>
          <button class="ghost-btn" id="toggleContext">
            <span>收起</span>
            <svg viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></svg>
          </button>
        </div>

        <div class="context-grid" id="contextBody">
          <div class="field">
            <div class="field-head">
              <label for="resumeInput">我的简历</label>
              <div class="field-tools">
                <span class="count" id="resumeCount">0 字</span>
                <button class="mini-btn" id="uploadBtn">
                  <svg viewBox="0 0 24 24"><path d="M12 16V5.5"/><path d="M8.2 9.3L12 5.5l3.8 3.8"/><path d="M4.8 15v2.6a2 2 0 0 0 2 2h10.4a2 2 0 0 0 2-2V15"/></svg>
                  上传 PDF / DOCX
                </button>
                <input type="file" id="fileInput" accept=".pdf,.docx" hidden>
              </div>
            </div>
            <textarea id="resumeInput" spellcheck="false" placeholder="把简历正文粘贴到这里。&#10;&#10;至少 50 字才能做 AI 分析。也可以点右上角上传 PDF 或 DOCX，我会自动提取文字。"></textarea>
            <div class="field-foot">
              <span class="hint" id="resumeHint">支持 PDF / DOCX，单文件不超过 10MB</span>
            </div>
          </div>

          <div class="field">
            <div class="field-head">
              <label for="jdInput">目标岗位 JD</label>
              <div class="field-tools">
                <span class="count" id="jdCount">0 字</span>
                <button class="mini-btn" id="clearJd">清空</button>
              </div>
            </div>
            <textarea id="jdInput" spellcheck="false" placeholder="把招聘要求粘贴到这里。&#10;&#10;写清楚岗位职责和技能要求，匹配度分析会准很多。"></textarea>
            <div class="field-foot">
              <span class="hint">留空时，部分分析仍可运行，但结果会偏泛</span>
            </div>
          </div>
        </div>

        <div class="context-summary" id="contextSummary">
          <span id="summaryText">简历未填写 · JD 未填写</span>
          <button class="ghost-btn" id="expandContext">展开编辑</button>
        </div>
      </section>

      <!-- 视图容器 -->
      <div id="view"></div>

    </div>
  </main>
</div>

<div class="toasts" id="toasts"></div>

<!-- 设置弹层 -->
<div class="modal" id="settingsModal" hidden>
  <div class="modal-panel">
    <h3>接口地址</h3>
    <p class="modal-desc">前端调用的后端服务地址。默认指向已部署的服务端。</p>
    <input type="url" id="apiInput" spellcheck="false">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="resetApi">恢复默认</button>
      <button class="btn btn-primary" id="saveApi">保存并重连</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
